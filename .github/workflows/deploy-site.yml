name: Deploy Site

on:
  push:
    branches: [main]
    paths: ['packages/landing/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skipped until the site stack has been applied and these are set. Lets
    # the workflow live in the repo without failing on every push before then.
    if: vars.SITE_BUCKET != ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:landing

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SITE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed assets under _next/static are immutable: cache for a year.
      # HTML is not: short TTL so a new deploy shows up after the invalidation.
      - name: Upload
        working-directory: packages/landing/out
        run: |
          aws s3 sync . "s3://${{ vars.SITE_BUCKET }}" --delete \
            --exclude '*.html' \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 sync . "s3://${{ vars.SITE_BUCKET }}" \
            --exclude '*' --include '*.html' \
            --cache-control 'public,max-age=60' \
            --content-type 'text/html; charset=utf-8'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*' > /dev/null
          echo "https://flagrship.dev"
