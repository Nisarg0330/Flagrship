[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flagrship-sdk"
version = "0.0.1"
description = "Flagrship SDK - evaluate feature flags in-process, no network call per check"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["flagrship*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
